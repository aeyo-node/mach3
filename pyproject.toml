[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swaram-market-engine"
version = "0.1.0"
description = "Production-grade multi-market quantitative intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Swaram Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.4",
    "websockets>=12.0",
    "aiohttp>=3.9.5",
    "polars>=0.20.25",
    "numpy>=1.26.4",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["swaram*", "apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
